[env:m5stack-dial]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TWAI_ISR_IN_IRAM=y
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DFS_MAX_OPEN_FILES=10
    -I.
    
; Library dependencies
lib_deps = 
    m5stack/M5Unified@^0.1.16
    m5stack/M5GFX@^0.1.16
    madhephaestus/ESP32Encoder@^0.11.6
    mathertel/OneButton@^2.5.0
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@^8.3.11
    mathieucarbou/ESPAsyncWebServer@^3.3.23
    kikuchan98/pngle@^1.0.2
    ; BLE is bundled with the ESP32 Arduino core — no extra lib_dep needed.
    ; If the build cannot find BLEDevice.h, uncomment the line below:
    ; nkolban/ESP32 BLE Arduino@^1.0.1
    
; Upload settings
upload_speed = 921600
monitor_speed = 115200

; Build settings
build_type = release
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.maximum_size = 8388

; NOTE: This M5Stack Dial hardware variant ships WITHOUT PSRAM.
; Confirmed on two units: PSRAM ID read returns 0x00ffffff (no chip present).
; Do NOT add -DBOARD_HAS_PSRAM or board_build.arduino.memory_type — both
; cause boot-time PSRAM init errors and provide no benefit. The firmware
; runs entirely from the ~320KB internal SRAM. Large allocations (logo
; splash buffer, web responses) must be kept small to fit internal heap.

; ---------------------------------------------------------------------------
; Makerfabs MaTouch ESP32-S3 Rotary 2.1" (ST7701S 480x480, 16MB flash, 8MB OPI PSRAM)
; Inherits platform pin + build flags from the Dial env; board selected by
; -DBOARD_MATOUCH21 (see include/BoardConfig.h). No RFID reader: the MFRC522
; lib is ignored and HAS_RFID=0 compiles the RFID code out.
; ---------------------------------------------------------------------------
[env:matouch21]
extends = env:m5stack-dial

build_flags =
    ${env:m5stack-dial.build_flags}
    -DBOARD_MATOUCH21
    -DBOARD_HAS_PSRAM

lib_deps =
    moononournation/GFX Library for Arduino@1.3.8
    madhephaestus/ESP32Encoder@^0.11.6
    mathertel/OneButton@^2.5.0
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@^8.3.11
    mathieucarbou/ESPAsyncWebServer@^3.3.23
    kikuchan98/pngle@^1.0.2
lib_ignore =
    MFRC522

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16MB.csv
